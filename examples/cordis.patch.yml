# Example profile patch — copy ONE of the two formats below into your dsh
# profile's cordis.patch.yml ($DSH_HOME/profiles/web/cordis.patch.yml) after
# installing both packages (`pnpm add dsh-green-meter dsh-client-ui-green-meter`).
#
# Format A (standard patch layer, `insert:` wrapper) works on current dsh
# releases. If your dsh version rejects the wrapper, use Format B (a flat
# entry list). Do not mix the two; every entry must start with `- `.
#
# ── Format A ─────────────────────────────────────────────────────────────
- insert:
    # Host plugin: token-profile energy/carbon/cost accounting.
    - id: green-meter
      name: 'dsh-green-meter'
      config:
        profile: proxy
        carbonFactorKgPerKwh: 0.5777
        electricityPriceCnyPerKwh: 0.56
        budgetJ: 0

    # Browser surface: composer-dock readout + detail panel.
    # panelPlacement: 'overlay' (default) = floating draggable drawer, works on
    # any vanilla install; 'popover' = patch-free card above the readout;
    # 'sidebar' = seat inside the sidebar, needs the ui-sidebar patch (patches/).
    - id: ui-green-meter
      name: 'dsh-client-ui-green-meter'
      config:
        panelPlacement: overlay

# ── Format B (flat entry list, no wrapper) ────────────────────────────────
# Uncomment this block instead if your dsh version rejects Format A:
# - id: green-meter
#   name: 'dsh-green-meter'
#   config:
#     profile: proxy
#     carbonFactorKgPerKwh: 0.5777
#     electricityPriceCnyPerKwh: 0.56
#     budgetJ: 0
#
# - id: ui-green-meter
#   name: 'dsh-client-ui-green-meter'
#   config:
#     panelPlacement: overlay
